# Same shape as the sibling demos: postgres and api internal-only, web is
# the single host-bound service (localhost only, port 8092), fronted by the
# VPS's own nginx (nginx/agent.build-with-deepak.com.conf) for TLS. Ollama
# runs on the VPS outside Docker.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: mcp_demo
      POSTGRES_USER: mcp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - mcp_pgdata:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      - postgres
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    environment:
      NODE_ENV: production
      PORT: 3000
      CORS_ORIGIN: https://agent.build-with-deepak.com
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      DEMO_TOKEN_TTL: ${DEMO_TOKEN_TTL:-2h}
      DATABASE_URL: postgres://mcp:${POSTGRES_PASSWORD}@postgres:5432/mcp_demo
      MCP_READONLY_PASSWORD: ${MCP_READONLY_PASSWORD:?set MCP_READONLY_PASSWORD in .env}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.1:8b}
      AGENT_MAX_STEPS: ${AGENT_MAX_STEPS:-6}
      MAX_QUESTION_CHARS: ${MAX_QUESTION_CHARS:-1000}
      RATE_LIMIT_TTL_MS: ${RATE_LIMIT_TTL_MS:-60000}
      RATE_LIMIT_LIMIT: ${RATE_LIMIT_LIMIT:-10}

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - '127.0.0.1:8092:80'

volumes:
  mcp_pgdata:
