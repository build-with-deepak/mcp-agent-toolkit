<div class="shell">
  <header class="topbar">
    <div class="topbar-inner">
      <div class="identity">
        <a
          class="topbar-logo"
          href="https://build-with-deepak.com"
          target="_blank"
          rel="noopener"
          aria-label="build-with-deepak.com home"
        >
          <img src="/build-with-light.png" alt="build-with-deepak.com" />
        </a>
        <a
          class="identity-text"
          href="https://build-with-deepak.com"
          target="_blank"
          rel="noopener"
          aria-label="build-with-deepak.com — Deepak Kumar Jha"
        >
          <span class="identity-name">Deepak Kumar Jha</span>
          <span class="identity-title">Technical Lead · Senior Node.js Engineer</span>
        </a>
      </div>

      <div class="topbar-actions">
        @if (auth.isAuthenticated()) {
          <span class="session-badge">Demo session</span>
        }
        <a
          class="cv-button"
          href="https://build-with-deepak.com/Deepak_Kumar_Jha_Technical_Lead.pdf"
          target="_blank"
          rel="noopener noreferrer"
        >
          Download CV
        </a>
        <a
          class="profile-link"
          href="https://www.linkedin.com/in/build-with-deepak/"
          target="_blank"
          rel="noopener me"
        >
          LinkedIn
        </a>
        <a
          class="profile-link"
          href="https://build-with-deepak.com"
          target="_blank"
          rel="noopener"
        >
          Full Profile →
        </a>
        @if (auth.isAuthenticated()) {
          <button class="logout" type="button" (click)="logout()">Sign out</button>
        }
      </div>
    </div>
  </header>

  <main class="content">
    <router-outlet />
  </main>

  <app-brand-footer current="agent" />
</div>
