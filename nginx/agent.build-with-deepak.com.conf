# Host-level nginx config for the VPS — NOT used inside Docker. Copy this to
# /etc/nginx/sites-available/agent.build-with-deepak.com, symlink it into
# sites-enabled, then run certbot as described in the README's Deploy
# section. This sits in front of the `web` container (docker-compose.yml),
# which is bound to 127.0.0.1:8092 specifically so only this host nginx can
# reach it — the container itself is never exposed to the public internet
# directly.

server {
    listen 80;
    server_name agent.build-with-deepak.com;

    # certbot's webroot challenge, before TLS exists yet on a fresh setup.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name agent.build-with-deepak.com;

    # certbot --nginx rewrites these two lines to point at the real cert
    # paths the first time it runs; the placeholders below just keep this
    # file parseable before that first run.
    ssl_certificate     /etc/letsencrypt/live/agent.build-with-deepak.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/agent.build-with-deepak.com/privkey.pem;

    client_max_body_size 20M;

    # SSE requires the same buffering-off treatment here as in the
    # container's own nginx.conf — otherwise this outer proxy re-buffers a
    # stream the inner one already forwarded unbuffered, and streaming is
    # lost again at this hop.
    location /api/agent/stream {
        proxy_pass http://127.0.0.1:8092/api/agent/stream;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:8092;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
